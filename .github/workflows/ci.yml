name: CI

on:
  pull_request:
  push:
    branches: [main]

# Fork PRs run with a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Private-path guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/ci/check-private-paths.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (changes in this PR / push only)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            ./gitleaks git --log-opts="$base..HEAD" --redact --no-banner
          else
            ./gitleaks git --log-opts="-1" --redact --no-banner
          fi

  web-tests:
    name: Web regression tests
    runs-on: ubuntu-latest
    needs: guard
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vehicle canvas lifecycle
        run: node tools/test-vehicle-canvas-lifecycle.js
      - name: Vehicle immersive lifecycle
        run: node tools/test-vehicle-immersive-lifecycle.js
      - name: GenAI localized contracts
        run: node tools/tests/genai-localized-contracts/run.cjs
      - name: Link manager cancellation UI
        run: node tools/tests/link-manager-cancellation/ui.test.cjs
      - name: Remote view localized clear
        run: node tools/tests/remote-view-localized-clear/run.cjs
      - name: Vehicle state hydration
        run: node tools/tests/vehicle-state-hydration/run.cjs

  build:
    name: OSS build
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.1.10909125" > /dev/null
      - name: Assemble (debug, no private overlay)
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
