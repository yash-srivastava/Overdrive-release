<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title data-i18n="app.live_view_title">Live View - OverDrive</title>
    <link rel="icon" type="image/webp" href="../shared/app-icon-dark.webp">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="../shared/app-icon-dark.webp">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#00876C">
    <script src="../shared/theme.js?v=6"></script>
    <script src="../shared/app-shell.js?v=5"></script>
    <script>
        if (typeof window.AndroidBridge !== 'undefined') {
            document.documentElement.classList.add('is-app-webview');
        }
    </script>
    <style>
        html.is-app-webview .cabin-listen-btn { display: none !important; }
    </style>
    <link rel="stylesheet" href="../shared/styles.css?v=27">
    <link rel="stylesheet" href="../shared/leaflet.css" />
    <script src="../shared/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jmuxer@2.0.4/dist/jmuxer.min.js"></script>
    <script src="../shared/SotaPlayer.js?v=13"></script>
    <script src="../shared/Decoder.js"></script>
    <script src="../shared/YUVCanvas.js"></script>
    <script src="../shared/Player.js"></script>
</head>
<body class="live-view-page">
    <div class="app-layout">
        <!-- Sidebar -->
        <!-- App shell sidebar (rendered by ../shared/app-shell.js) -->
        <div id="app-shell-mount"></div>
        <!-- Main Content -->
        <main class="main-content">
            <div class="mobile-header" id="mobileHeader">
                <button class="menu-toggle" onclick="toggleSidebar()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
                    </svg>
                </button>
                <div class="brand"><span class="brand-name" style="font-size:16px;">OverDrive</span></div>
                <div style="width:40px;"></div>
            </div>

            <div class="live-tabs-view" id="tabsView">
                <div class="tab-content">
                    <!-- Camera-first Live dashboard. In landscape the camera
                         stage keeps most of the canvas while the selector and
                         location preview share a utility rail on the right. -->
                    <div class="tab-panel active" id="panelCameras">
                        <div class="seamless-camera-view">
                            <div class="camera-stage">
                            <!-- Top Bar -->
                            <div class="camera-top-bar">
                                <div class="top-bar-left">
                                    <div class="connection-status" id="connectionStatus" role="status"
                                         aria-label="Select Camera"
                                         data-i18n-attr="aria-label:pip.select_camera">
                                        <span class="conn-dot"></span>
                                    </div>
                                    <div class="decoder-chip" id="decoderChip" style="display:none;">GPU</div>
                                </div>
                                <div class="top-bar-right">
                                    <!-- The <select> stays the source of truth for the
                                         quality value and its localized labels; the
                                         trigger and list mirror it because a native
                                         option popup can't be themed. -->
                                    <div class="quality-menu" id="qualityMenu">
                                        <select id="qualitySelector" class="quality-menu__native" onchange="BYD.stream.setQuality(this.value)">
                                            <option value="ULTRA_LOW"  data-i18n="stream.quality_ultra_low">Ultra Low (400k)</option>
                                            <option value="LOW"        data-i18n="stream.quality_low">Low (600k)</option>
                                            <option value="MEDIUM"     selected data-i18n="stream.quality_medium">Medium (1M)</option>
                                            <option value="HIGH"       data-i18n="stream.quality_high">High (1.5M)</option>
                                            <option value="ULTRA_HIGH" data-i18n="stream.quality_ultra_high">Ultra High (2.5M)</option>
                                            <option value="SMOOTH"     data-i18n="stream.quality_smooth">Smooth (3.5M, 25 fps)</option>
                                            <option value="MAX"        data-i18n="stream.quality_max">Max (5M, 30 fps)</option>
                                        </select>
                                        <button type="button" class="quality-menu__trigger" id="qualityMenuTrigger"
                                                aria-haspopup="listbox" aria-expanded="false"
                                                data-i18n-attr="aria-label:recording.video_quality_title"
                                                aria-label="Video Quality">
                                            <span class="quality-menu__value" id="qualityMenuValue">Medium (1M)</span>
                                            <svg class="quality-menu__chevron" viewBox="0 0 24 24" fill="none"
                                                 stroke="currentColor" stroke-width="2" aria-hidden="true">
                                                <path d="m6 9 6 6 6-6"/>
                                            </svg>
                                        </button>
                                        <div class="quality-menu__list" id="qualityMenuList" role="listbox"></div>
                                    </div>
                                    <button class="top-bar-btn cabin-listen-btn"
                                            id="cabinListenButton"
                                            type="button"
                                            onclick="BYD.cabinListener.toggle()"
                                            aria-pressed="false"
                                            data-i18n-attr="title:liveview.listen_cabin;aria-label:liveview.listen_cabin"
                                            title="Listen to cabin"
                                            aria-label="Listen to cabin">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                            <path d="M11 5 6 9H2v6h4l5 4V5Z"/>
                                            <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
                                            <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
                                        </svg>
                                    </button>
                                    <button class="top-bar-btn" onclick="BYD.stream.toggleFullscreen()">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
                                            <path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <!-- Video Display -->
                            <div class="video-display-area" id="videoDisplayArea">
                                <video id="hw_player" autoplay muted playsinline></video>
                                <div id="sw_container"></div>
                                <canvas id="sota_canvas"></canvas>
                                <div class="video-idle-state" id="videoIdleState">
                                    <div class="idle-icon">
                                        <svg class="idle-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                            <path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/>
                                        </svg>
                                        <svg class="idle-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                             stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                                            <path d="M12 9v4"/><path d="M12 17h.01"/>
                                            <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/>
                                        </svg>
                                        <span class="idle-spinner" aria-hidden="true"></span>
                                    </div>
                                    <span class="idle-text" data-i18n="stream.idle_hint">Tap a camera on the car below</span>
                                    <span class="idle-subtext" id="videoIdleSubtext"></span>
                                </div>
                                <div class="camera-label-overlay" id="cameraLabelOverlay" style="display:none;">
                                    <span id="currentCameraLabel" data-i18n="stream.front_camera">Front Camera</span>
                                </div>

                                <!-- Deterrent controls — manual horn + light triggers so the
                                     camera view is an active security tool, not just a passive
                                     monitor (see issue #118). Both route to cloud-only vehicle
                                     commands (FINDCAR = horn+lights, FLASHLIGHT = lights only),
                                     so the whole cluster stays display:none until the cloud
                                     status probe below confirms the account is configured +
                                     verified. Each fire is gated behind a themed confirm dialog
                                     to prevent accidental activation. -->
                                <div class="deterrent-controls" id="deterrentControls" style="display:none;"
                                     role="group" data-i18n-attr="aria-label:liveview.deterrent_group_label"
                                     aria-label="Vehicle deterrent controls">
                                    <button type="button" class="deterrent-btn deterrent-horn" id="deterrentHornBtn"
                                            onclick="BYD.stream.fireDeterrent('horn')"
                                            data-i18n-attr="title:liveview.deterrent_horn;aria-label:liveview.deterrent_horn"
                                            title="Horn" aria-label="Horn">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                                        </svg>
                                        <span class="deterrent-label" data-i18n="liveview.deterrent_horn">Horn</span>
                                    </button>
                                    <button type="button" class="deterrent-btn deterrent-flash" id="deterrentFlashBtn"
                                            onclick="BYD.stream.fireDeterrent('flash')"
                                            data-i18n-attr="title:liveview.deterrent_flash;aria-label:liveview.deterrent_flash"
                                            title="Flash" aria-label="Flash">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                                        </svg>
                                        <span class="deterrent-label" data-i18n="liveview.deterrent_flash">Flash</span>
                                    </button>
                                </div>
                            </div>
                            </div>

                            <aside class="live-utility-rail" id="liveUtilityRail">
                            <section class="camera-selector-card" aria-label="Camera selector">
                            <!-- Camera selector — first card in the landscape utility rail. -->
                            <div class="selector-card-header">
                                <h2 data-i18n="liveview.cameras">Cameras</h2>
                            </div>
                            <div class="car-selector-bottom">
                                <div class="car-image-container">
                                    <img class="car-image-fallback"
                                         src="../shared/car-icon.webp"
                                         alt=""
                                         aria-hidden="true">
                                    <canvas id="liveCarCanvas" class="car-image" aria-hidden="true"></canvas>
                                    
                                    <!-- Camera Hotspots with Pulse Animation -->
                                    <div class="cam-hotspot" data-cam="1" onclick="BYD.stream.selectCamera(1)">
                                        <div class="hotspot-pulse"></div>
                                        <div class="hotspot-ring"></div>
                                        <span class="hotspot-label" data-i18n="stream.hotspot_front">FRONT</span>
                                    </div>
                                    <!-- OEM Dashcam (data-cam=6). Hidden by default; the
                                         init script unhides it iff /api/settings/quality
                                         reports oemDashcam.oemDashcamCameraId >= 0. The
                                         "DVR" pill sits on the hood, slightly off-centre
                                         from the FRONT quadrant marker so users see the
                                         standalone dashcam sensor as distinct from the
                                         AVM front-quadrant stitch. -->
                                    <div class="cam-hotspot cam-dvr" data-cam="6" style="display:none;" onclick="BYD.stream.selectCamera(6)">
                                        <div class="hotspot-pulse"></div>
                                        <div class="hotspot-ring"></div>
                                        <span class="hotspot-label" data-i18n="stream.hotspot_oem_dashcam">DVR</span>
                                    </div>
                                    <div class="cam-hotspot" data-cam="3" onclick="BYD.stream.selectCamera(3)">
                                        <div class="hotspot-pulse"></div>
                                        <div class="hotspot-ring"></div>
                                        <span class="hotspot-label" data-i18n="stream.hotspot_rear">REAR</span>
                                    </div>
                                    <div class="cam-hotspot" data-cam="4" onclick="BYD.stream.selectCamera(4)">
                                        <div class="hotspot-pulse"></div>
                                        <div class="hotspot-ring"></div>
                                        <span class="hotspot-label" data-i18n="stream.hotspot_left">LEFT</span>
                                    </div>
                                    <div class="cam-hotspot" data-cam="2" onclick="BYD.stream.selectCamera(2)">
                                        <div class="hotspot-pulse"></div>
                                        <div class="hotspot-ring"></div>
                                        <span class="hotspot-label" data-i18n="stream.hotspot_right">RIGHT</span>
                                    </div>
                                    <div class="cam-hotspot cam-all" data-cam="0" onclick="BYD.stream.selectCamera(0)">
                                        <div class="hotspot-pulse"></div>
                                        <div class="hotspot-ring"></div>
                                        <span class="hotspot-label" data-i18n="stream.hotspot_all">ALL</span>
                                    </div>
                                </div>
                            </div>
                            </section>

                            <section class="live-location-card" id="locationCard">
                                <div class="location-card-header">
                                    <div>
                                        <h2 data-i18n="dashboard.card_location">Vehicle location</h2>
                                        <div class="location-freshness">
                                            <span class="location-freshness-dot"></span>
                                            <span id="lastGpsUpdate">--</span>
                                        </div>
                                    </div>
                                    <button type="button" class="location-close-button"
                                            onclick="BYD.liveLayout.setMapExpanded(false)"
                                            data-i18n-attr="aria-label:liveview.back_to_cameras"
                                            aria-label="Back to cameras">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="m15 18-6-6 6-6"/>
                                        </svg>
                                        <span data-i18n="common.back">Back</span>
                                    </button>
                                </div>

                                <div class="location-map-frame">
                                    <div class="map-container" id="mapContainer"></div>
                                    <div class="map-overlay-actions">
                                        <button class="btn-map-float btn-my-location"
                                                onclick="BYD.map.showMyLocation()"
                                                data-i18n-attr="aria-label:liveview.my_location"
                                                aria-label="Show my location">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/>
                                            </svg>
                                        </button>
                                        <button class="btn-map-float btn-directions"
                                                onclick="BYD.map.openDirections()"
                                                data-i18n-attr="aria-label:liveview.directions"
                                                aria-label="Directions to vehicle">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
                                        </button>
                                    </div>
                                    <div class="location-distance-chip">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                                        </svg>
                                        <span id="distanceToCar">--</span>
                                    </div>
                                </div>

                                <button type="button" class="location-expand-button"
                                        id="locationExpandButton"
                                        onclick="BYD.liveLayout.toggleMap()"
                                        aria-expanded="false">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
                                        <path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
                                    </svg>
                                    <span id="locationExpandLabel" data-i18n="liveview.expand_map">Expand map</span>
                                </button>
                            </section>
                            </aside>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <div id="toastContainer" class="toast-container"></div>

    <style>
        /* Theme tokens for the Live View page. The chrome (top bar chips,
           quality select, rail cards) resolves to the shared M3 surface
           tokens so it matches the rest of the app in both schemes; only the
           video stage and its scrim need page-local values. */
        .live-view-page {
            --lv-panel-bg: var(--surface);
            --lv-top-overlay: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 100%);
            --lv-pill-bg: var(--surface-container);
            --lv-pill-bg-hover: var(--surface-container-high);
            --lv-pill-border: var(--outline-variant);
            --lv-pill-border-soft: var(--outline-variant);
            --lv-overlay-text: var(--on-surface);
            --lv-label-overlay-bg: var(--surface-container);
            --lv-idle-icon-bg: var(--surface-container);
            --lv-idle-icon-border: var(--outline-variant);
            /* Camera controls sit over user-selected vehicle paint, so their
               contrast must not depend on either paint colour or app theme.
               A light edge + dark halo remains visible on white and black. */
            --lv-hotspot-ring-border: rgba(255,255,255,0.96);
            --lv-hotspot-ring-bg: rgba(5,10,12,0.82);
            --lv-hotspot-ring-halo: rgba(0,0,0,0.88);
            --lv-hotspot-label-bg: rgba(5,9,12,0.92);
            --lv-hotspot-label-border: rgba(255,255,255,0.24);
            --lv-hotspot-label-text: #ffffff;
            --lv-hotspot-active-text: #72f4d9;
            /* Video stage / letterbox background. Dark theme keeps the
               classic black-bars look; light theme flips to the page surface
               so the camera tab isn't a giant black slab on a light cabin
               display. The decoded video's own pixels still cover most of
               the area while a stream is active — this colour is only
               visible in idle / buffer / aspect-mismatch regions. */
            --lv-video-bg: #000;
        }
        :root[data-theme="light"] .live-view-page {
            /* Everything else already flips with the shared tokens. The scrim
               and the letterbox are the two values that cannot: both sit over
               decoded video rather than over a themed surface. */
            --lv-top-overlay: linear-gradient(180deg, rgba(247,250,247,0.85) 0%, transparent 100%);
            --lv-video-bg: var(--bg-base);
        }

        /* SOTA Seamless Camera View */
        .seamless-camera-view {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--lv-panel-bg);
            position: relative;
            overflow: hidden;
        }

        /* Top Bar */
        .camera-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: var(--lv-top-overlay);
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 20;
        }

        /* Margin, NOT flex `gap`: gap is Chrome 84+ and this page runs in a
           Chrome 58 WebView on the head unit. */
        .top-bar-left, .top-bar-right { display: flex; align-items: center; }
        .top-bar-left > * + *, .top-bar-right > * + * { margin-left: 10px; }
        [dir="rtl"] .top-bar-left > * + *,
        [dir="rtl"] .top-bar-right > * + * { margin-left: 0; margin-right: 10px; }
        /* Top-aligned: the row's height comes from the quality menu opposite,
           which would otherwise push the dot below its own left inset. */
        .top-bar-left { min-width: 0; align-self: flex-start; }
        .top-bar-right { flex: 0 0 auto; }

        /* The dot carries no text, so its accessible name lives on aria-label
           — see BYD.stream.updateConnectionStatus. */
        .connection-status {
            display: inline-flex;
            align-items: center;
        }

        .conn-dot {
            width: 10px; height: 10px;
            flex: 0 0 10px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: all 0.3s;
        }
        
        .connection-status.live .conn-dot {
            background: var(--status-success);
            animation: pulse 1.5s infinite;
        }
        
        .connection-status.connecting .conn-dot {
            background: var(--status-warning);
            animation: pulse 0.6s infinite;
        }

        .connection-status.disconnected .conn-dot {
            background: var(--status-danger);
        }
        
        .decoder-chip {
            padding: 6px 10px;
            background: var(--primary-container);
            border-radius: var(--radius-md);
            font-size: 10px;
            font-weight: 700;
            color: var(--on-primary-container);
            letter-spacing: 0.05em;
        }

        /* Set from JS as the player resolves a decoder. */
        .decoder-chip.is-native {
            background: var(--status-success-container);
            color: var(--status-success);
        }

        .decoder-chip.is-fallback {
            background: var(--status-warning-container);
            color: var(--status-warning);
        }
        
        .quality-menu { position: relative; }
        .quality-menu__native { display: none; }

        .quality-menu__trigger {
            display: flex;
            align-items: center;
            min-width: 80px;
            padding: 8px 10px 8px 14px;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--lv-pill-bg);
            border: 1px solid var(--lv-pill-border);
            border-radius: var(--radius-md);
            cursor: pointer;
            outline: none;
        }

        .quality-menu__trigger:hover { background: var(--lv-pill-bg-hover); }

        .quality-menu__value {
            flex: 1 1 auto;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: left;
        }

        .quality-menu__chevron {
            flex: 0 0 auto;
            width: 14px;
            height: 14px;
            margin-left: 8px;
            color: var(--on-surface-variant);
        }

        /* Fixed, so the panel escapes the stage's overflow clipping; JS anchors
           it to the trigger and flips it above when the viewport is short. */
        .quality-menu__list {
            display: none;
            position: fixed;
            z-index: 120;
            max-height: 320px;
            padding: 4px;
            overflow-y: auto;
            background: var(--surface-container-high);
            border: 1px solid var(--outline-variant);
            border-radius: var(--radius-md);
        }

        .quality-menu__list.is-open { display: block; }

        .quality-menu__option {
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            color: var(--on-surface);
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
        }

        .quality-menu__option:hover { background: var(--surface-container-highest); }

        .quality-menu__option[aria-selected="true"] {
            background: var(--secondary-container);
            color: var(--on-secondary-container);
            font-weight: 600;
        }

        .top-bar-btn {
            width: 38px; height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--lv-pill-bg);
            border: 1px solid var(--lv-pill-border);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .top-bar-btn:hover { background: var(--lv-pill-bg-hover); color: var(--text-primary); }
        .top-bar-btn svg { width: 18px; height: 18px; }
        .cabin-listen-btn.is-active {
            color: var(--on-primary-container);
            border-color: var(--primary-container);
            background: var(--primary-container);
        }
        .cabin-listen-btn.is-connecting {
            color: var(--status-warning);
            border-color: var(--status-warning);
        }
        .cabin-listen-btn.is-paused {
            color: var(--status-warning);
            border-color: var(--status-warning);
            background: var(--status-warning-container);
        }
        
        /* Video Display — the stage and the layered video / canvas /
           software-decoder containers all share --lv-video-bg so the camera
           tab flips palette with the rest of the app. Dark theme resolves
           it to #000 (the classic letterbox look); light theme resolves it
           to the page surface so the panel doesn't read as a black slab on
           a light cabin display. The decoded video's own pixels cover most
           of the area while streaming, so this colour is only visible in
           idle / buffer / aspect-mismatch regions. */
        .video-display-area {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            overflow: hidden;
            background: var(--lv-video-bg);
        }

        .video-display-area video, .video-display-area #sw_container {
            position: absolute;
            max-width: 100%; max-height: 100%;
            width: 100%; height: 100%;
            object-fit: contain;
            display: none;
            background: var(--lv-video-bg);
        }

        .video-display-area #sota_canvas {
            position: absolute;
            max-width: 100%; max-height: 100%;
            width: 100%; height: 100%;
            object-fit: contain;
            display: none;
            background: var(--lv-video-bg);
            z-index: 10;
        }
        
        .video-display-area video.active, .video-display-area #sw_container.active { display: block; }
        .video-display-area #sota_canvas.active { display: block !important; }
        
        .video-idle-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            transition: opacity 0.3s;
        }
        
        .video-idle-state.hidden { opacity: 0; pointer-events: none; }
        
        .idle-icon {
            width: 64px; height: 64px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--lv-idle-icon-bg);
            border: 1px solid var(--lv-idle-icon-border);
            border-radius: var(--radius-md);
        }

        .idle-icon svg { width: 32px; height: 32px; opacity: 0.5; }
        .idle-alert { display: none; }
        .idle-text { font-size: 14px; font-weight: 500; }

        .idle-subtext {
            display: none;
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .idle-spinner {
            display: none;
            width: 26px;
            height: 26px;
            border: 2px solid var(--outline-variant);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: idleSpin 0.9s linear infinite;
        }

        .video-idle-state.is-busy .idle-glyph { display: none; }
        .video-idle-state.is-busy .idle-spinner { display: block; }

        .video-idle-state.is-error .idle-glyph { display: none; }
        .video-idle-state.is-error .idle-alert { display: block; opacity: 1; }
        .video-idle-state.is-error .idle-subtext { display: block; }

        .video-idle-state.is-error .idle-icon {
            background: var(--status-danger-container);
            border-color: transparent;
            color: var(--status-danger);
        }

        .video-idle-state.is-error .idle-text { color: var(--on-surface); }

        .video-idle-state.is-busy .idle-icon {
            width: auto;
            height: auto;
            margin-bottom: 14px;
            background: none;
            border: 0;
        }

        @keyframes idleSpin { to { transform: rotate(360deg); } }

        .camera-label-overlay {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            background: var(--lv-label-overlay-bg);
            border: 1px solid var(--lv-pill-border);
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 600;
            z-index: 10;
        }

        /* Deterrent controls — bottom-right buttons layered over the video
           stage. Anchored to the video-display-area (not the top bar) so they
           sit within reach of the thumb over the live feed and never collide
           with the connection pill / quality select up top or the camera label
           overlay (top-centre). z-index 15 keeps them above the decoded video
           (z 10) and idle state, below the top-bar chrome (z 20) so a
           quality-select dropdown still overlays them.

           Chrome-58 (BYD in-app WebView) notes:
             - No flex `gap` in this old engine; buttons are spaced with a
               sibling margin instead.
             - safe-bottom inset keeps the cluster clear of the gesture bar
               in fullscreen / notched displays. */
        .deterrent-controls {
            position: absolute;
            right: 16px;
            bottom: calc(16px + var(--safe-bottom, 0px));
            display: flex;
            flex-direction: column;
            align-items: stretch;
            z-index: 15;
        }
        .deterrent-controls .deterrent-btn + .deterrent-btn { margin-top: 10px; }

        .deterrent-btn {
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            min-width: 108px;
            padding: 10px 16px;
            background: var(--lv-pill-bg);
            border: 1px solid var(--lv-pill-border);
            border-radius: var(--radius-md);
            color: var(--lv-overlay-text);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .deterrent-btn svg { width: 18px; height: 18px; margin-right: 8px; flex: 0 0 18px; }
        .deterrent-btn .deterrent-label { line-height: 1; white-space: nowrap; }
        .deterrent-btn:hover { background: var(--lv-pill-bg-hover); border-color: var(--brand-primary); }
        .deterrent-btn:active { transform: scale(0.96); }

        .deterrent-horn svg { color: var(--status-warning); }
        .deterrent-horn:hover { border-color: var(--status-warning); }
        .deterrent-flash svg { color: var(--brand-primary); }

        /* Pending state while the cloud round-trip is in flight — dim +
           block re-taps so a double-tap doesn't queue two horn commands. */
        .deterrent-btn.pending {
            opacity: 0.55;
            pointer-events: none;
        }

        /* Bottom Car Selector */
        .car-selector-bottom {
            flex-shrink: 0;
            padding: 20px 16px 24px 16px;
            padding-bottom: calc(30px + var(--safe-bottom));
            background: transparent;
            display: flex;
            justify-content: center;
        }
        
        /* The silhouette fills its card, and the FRONT / REAR labels hang
           outside the box — so the gutters that reserve room for them are the
           same values subtracted from max-height. Overriding one without the
           other clips the labels on a short card. */
        .car-image-container {
            --car-gutter-top: 22px;
            --car-gutter-bottom: 30px;
            position: relative;
            width: 112px;
            height: 230px;
            max-width: 100%;
            max-height: calc(100% - var(--car-gutter-top) - var(--car-gutter-bottom));
            margin: var(--car-gutter-top) auto var(--car-gutter-bottom) auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .car-image-fallback,
        .car-image {
            width: 100%;
            height: 100%;
            display: block;
        }

        .car-image-fallback {
            position: absolute;
            inset: 0;
            z-index: 2;
            object-fit: contain;
            opacity: 0.72;
            transition: opacity 0.18s ease;
        }

        .car-image {
            position: relative;
            z-index: 3;
            opacity: 0;
            transition:
                opacity 0.18s ease,
                transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .car-image-container.vehicle-render-ready .car-image-fallback {
            opacity: 0;
        }

        .car-image-container.vehicle-render-ready .car-image {
            opacity: 1;
        }
        
        /* Camera Hotspots */
        .cam-hotspot {
            position: absolute;
            width: 40px; height: 40px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            z-index: 10;
        }
        
        .cam-hotspot:hover { transform: scale(1.15); }
        
        /* Hotspot positions for vertical car (112x230) */
        .cam-hotspot[data-cam="1"] { top: -8px; left: 50%; transform: translateX(-50%); }
        .cam-hotspot[data-cam="3"] { bottom: -8px; left: 50%; transform: translateX(-50%); }
        .cam-hotspot[data-cam="4"] { top: 50%; left: -20px; transform: translateY(-50%); }
        .cam-hotspot[data-cam="2"] { top: 50%; right: -20px; transform: translateY(-50%); }
        .cam-hotspot.cam-all { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        /* OEM Dashcam pill — sits on the hood, just below the FRONT
           hotspot (top:-8px) and offset right of centre so the DVR ring
           and FRONT ring read as two distinct sensors. The "DVR" label
           is anchored to the right side of its hotspot to avoid colliding
           with the FRONT label that sits directly above the same column. */
        .cam-hotspot[data-cam="6"] { top: 30px; left: 62%; transform: translateX(-50%); }
        
        .hotspot-ring {
            width: 26px; height: 26px;
            box-sizing: border-box;
            border: 2px solid var(--lv-hotspot-ring-border);
            border-radius: 50%;
            background: var(--lv-hotspot-ring-bg);
            box-shadow:
                0 0 0 2px var(--lv-hotspot-ring-halo),
                0 2px 6px rgba(0,0,0,0.72);
            transition: all 0.3s;
        }
        
        .hotspot-pulse {
            position: absolute;
            width: 26px; height: 26px;
            border-radius: 50%;
            background: transparent;
            pointer-events: none;
        }
        
        /* Labels positioned outside hotspots */
        .hotspot-label {
            position: absolute;
            font-size: 11px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: var(--lv-hotspot-label-text);
            background: var(--lv-hotspot-label-bg);
            border: 1px solid var(--lv-hotspot-label-border);
            border-radius: 999px;
            padding: 4px 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.62);
            text-shadow: none;
            white-space: nowrap;
            transition: all 0.3s;
        }
        
        /* Front label - above */
        .cam-hotspot[data-cam="1"] .hotspot-label { bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%); top: auto; }
        /* Rear label - below with more clearance */
        .cam-hotspot[data-cam="3"] .hotspot-label { top: calc(100% + 2px); left: 50%; transform: translateX(-50%); bottom: auto; }
        /* Left label - to the left */
        .cam-hotspot[data-cam="4"] .hotspot-label { right: calc(100% + 4px); left: auto; top: 50%; transform: translateY(-50%); bottom: auto; }
        /* Right label - to the right */
        .cam-hotspot[data-cam="2"] .hotspot-label { left: calc(100% + 4px); right: auto; top: 50%; transform: translateY(-50%); bottom: auto; }
        /* All label - below center */
        .cam-hotspot.cam-all .hotspot-label { top: calc(50% + 16px); left: 50%; transform: translateX(-50%); bottom: auto; }
        /* OEM Dashcam label — anchored to the right of the ring so it
           floats outside the car silhouette and never overlaps the FRONT
           label that sits directly above the centre column. */
        .cam-hotspot[data-cam="6"] .hotspot-label {
            left: calc(100% + 4px);
            top: 50%;
            transform: translateY(-50%);
            bottom: auto;
        }
        
        .cam-hotspot:hover .hotspot-ring {
            border-color: var(--brand-primary);
            background: rgba(0,42,36,0.9);
            box-shadow:
                0 0 0 2px var(--lv-hotspot-ring-halo),
                0 0 0 4px rgba(0,212,170,0.2);
        }
        
        .cam-hotspot:hover .hotspot-label {
            color: var(--lv-hotspot-active-text);
            border-color: rgba(0,212,170,0.62);
        }
        
        /* Active State with Animation */
        .cam-hotspot.active .hotspot-ring {
            border-color: var(--brand-primary);
            background: rgba(0,48,40,0.94);
            animation: ringPulse 2s ease-in-out infinite;
        }
        
        .cam-hotspot.active .hotspot-pulse {
            background: rgba(0,212,170,0.4);
            animation: hotspotPulse 1.5s ease-out infinite;
        }
        
        .cam-hotspot.active .hotspot-label {
            color: var(--lv-hotspot-active-text);
            background: rgba(0,35,31,0.96);
            border-color: rgba(0,212,170,0.72);
            box-shadow: 0 2px 6px rgba(0,0,0,0.68);
        }
        
        @keyframes hotspotPulse {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        
        @keyframes ringPulse {
            0%, 100% {
                box-shadow:
                    0 0 0 2px var(--lv-hotspot-ring-halo),
                    0 0 0 4px rgba(0,212,170,0.2);
            }
            50% {
                box-shadow:
                    0 0 0 2px var(--lv-hotspot-ring-halo),
                    0 0 0 6px rgba(0,212,170,0.32);
            }
        }

        /* Camera-first Live dashboard */
        .camera-stage {
            position: relative;
            display: flex;
            flex: 1 1 auto;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .live-utility-rail {
            display: flex;
            flex: 0 0 auto;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            padding: 12px;
            background: var(--lv-panel-bg);
        }

        .camera-selector-card,
        .live-location-card {
            border: 1px solid var(--lv-pill-border-soft);
            border-radius: var(--radius-md);
            background: var(--surface-container-low);
            overflow: hidden;
        }

        .camera-selector-card {
            display: flex;
            flex: 1 1 54%;
            flex-direction: column;
            min-height: 210px;
        }

        .selector-card-header {
            flex: 0 0 auto;
            padding: 12px 14px 0;
        }

        .camera-selector-card .car-selector-bottom {
            flex: 1 1 auto;
            width: 100%;
            padding: 12px;
            background: transparent;
            align-items: center;
        }

        .live-location-card {
            position: relative;
            display: flex;
            flex: 1 1 46%;
            flex-direction: column;
            min-height: 210px;
            margin-top: 12px;
            transition: border-radius 180ms ease, margin 180ms ease;
        }

        .location-card-header {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px 10px;
        }

        .selector-card-header h2,
        .location-card-header h2 {
            margin: 0;
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 700;
            line-height: 1.2;
        }

        .location-freshness {
            display: flex;
            align-items: center;
            margin-top: 5px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 500;
        }

        .location-freshness-dot {
            width: 7px;
            height: 7px;
            margin-right: 6px;
            border-radius: 50%;
            background: var(--status-success);
        }

        .location-map-frame {
            position: relative;
            flex: 1 1 auto;
            min-height: 100px;
            margin: 0 12px;
            overflow: hidden;
            border: 1px solid var(--lv-pill-border-soft);
            border-radius: var(--radius-md);
            background: var(--surface-container-lowest);
        }

        .location-map-frame .map-container,
        .location-map-frame .leaflet-container {
            width: 100%;
            height: 100%;
        }

        .location-distance-chip {
            position: absolute;
            left: 8px;
            bottom: 8px;
            z-index: 20;
            display: flex;
            align-items: center;
            padding: 6px 9px;
            border: 1px solid var(--outline-variant);
            border-radius: var(--radius-md);
            background: var(--surface-container);
            color: var(--on-surface-variant);
            font-size: 10px;
            font-weight: 600;
        }

        .location-distance-chip svg {
            width: 13px;
            height: 13px;
            margin-right: 5px;
            color: var(--on-surface-variant);
        }

        .location-expand-button {
            display: flex;
            flex: 0 0 44px;
            align-items: center;
            justify-content: center;
            margin: 10px 12px 12px;
            border: 0;
            border-radius: var(--radius-md);
            background: var(--secondary-container);
            color: var(--on-secondary-container);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .location-expand-button svg {
            width: 16px;
            height: 16px;
            margin-right: 8px;
        }

        .location-close-button {
            display: none;
            flex: 0 0 auto;
            height: 32px;
            padding: 0 10px 0 6px;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--on-surface-variant);
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .location-close-button:hover {
            background: var(--surface-container-high);
            color: var(--on-surface);
        }

        .location-close-button svg {
            width: 16px;
            height: 16px;
            margin-right: 4px;
        }

        /* Compact preview is deliberately passive: map controls and the
           Leaflet chrome appear only after the user explicitly expands it. */
        #panelCameras:not(.map-expanded) .map-overlay-actions,
        #panelCameras:not(.map-expanded) .location-map-frame .leaflet-control-container {
            display: none;
        }

        /* Expanding location promotes the existing map card over the camera
           dashboard, preserving the stream and selected view underneath. */
        #panelCameras.map-expanded .live-location-card {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            min-height: 0;
            margin: 0;
            border: 0;
            border-radius: 0;
            background: var(--surface);
        }

        #panelCameras.map-expanded .location-card-header {
            justify-content: flex-start;
            padding: 12px 16px;
            border-bottom: 1px solid var(--outline-variant);
            background: var(--surface-container);
        }

        /* Margin, NOT flex `gap`: gap is Chrome 84+ and BYD's in-app WebView is
           Chrome 58, where the title would butt against the button. */
        #panelCameras.map-expanded .location-close-button {
            display: flex;
            order: -1;
            margin-right: 6px;
        }

        [dir="rtl"] #panelCameras.map-expanded .location-close-button {
            margin-right: 0;
            margin-left: 6px;
        }

        /* min-width:0 lets the title yield first: this is a nowrap flex row, and
           a long localized title overflows the header on a 320px phone. */
        #panelCameras.map-expanded .location-card-header > div:first-child {
            min-width: 0;
            overflow: hidden;
        }

        #panelCameras.map-expanded .location-card-header h2 {
            font-size: 18px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #panelCameras.map-expanded .location-map-frame {
            min-height: 0;
            margin: 0;
            border: 0;
            border-radius: 0;
        }

        #panelCameras.map-expanded .map-overlay-actions {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        #panelCameras.map-expanded .map-overlay-actions .btn-map-float + .btn-map-float {
            margin-top: 8px;
        }

        #panelCameras.map-expanded .location-distance-chip {
            left: 16px;
            bottom: 16px;
            padding: 8px 12px;
            font-size: 12px;
        }

        #panelCameras.map-expanded .location-expand-button {
            display: none;
        }
        
        /* Fullscreen */
        .seamless-camera-view.fullscreen {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 1000;
        }
        
        /* Mobile */
        @media (max-width: 768px) {
            .camera-top-bar { padding: 12px; }
            .top-bar-left > * + *, .top-bar-right > * + * { margin-left: 6px; }
            [dir="rtl"] .top-bar-left > * + *,
            [dir="rtl"] .top-bar-right > * + * { margin-right: 6px; }
            .top-bar-left { flex: 1 1 auto; }
            .decoder-chip { padding: 4px 8px; font-size: 9px; }
            .quality-menu__trigger {
                width: 108px;
                min-width: 108px;
                max-width: 108px;
                padding: 6px 8px 6px 10px;
                font-size: 11px;
            }
            .quality-menu__option { padding: 11px 12px; font-size: 12px; }
            .top-bar-btn { width: 34px; height: 34px; }
            .car-selector-bottom { padding: 10px; padding-bottom: calc(14px + 60px + var(--safe-bottom)); }
            .car-image-container {
                --car-gutter-top: 20px;
                --car-gutter-bottom: 28px;
                width: 96px;
                height: 200px;
            }
            .cam-hotspot { width: 36px; height: 36px; }
            .hotspot-ring { width: 24px; height: 24px; }
            .hotspot-pulse { width: 24px; height: 24px; }
            .hotspot-label { font-size: 9px; padding: 3px 5px; }
            /* DVR sits a touch closer to FRONT on the smaller silhouette. */
            .cam-hotspot[data-cam="6"] { top: 24px; left: 62%; }
            .idle-icon { width: 48px; height: 48px; }
            .idle-icon svg { width: 24px; height: 24px; }
            .idle-text { font-size: 12px; }
            /* Tighter deterrent buttons on phones so the pair doesn't crowd
               the bottom-right of a small video stage. */
            .deterrent-controls { right: 12px; bottom: calc(12px + var(--safe-bottom, 0px)); }
            .deterrent-btn { min-width: 96px; padding: 9px 12px; font-size: 12px; }
            .deterrent-btn svg { width: 16px; height: 16px; flex: 0 0 16px; margin-right: 6px; }
            .deterrent-controls .deterrent-btn + .deterrent-btn { margin-top: 8px; }

            /* On narrow/portrait screens keep the same information
               architecture but stack the utility cards below the cameras. */
            #panelCameras .seamless-camera-view {
                overflow-y: auto;
            }
            /* The stage GROWS to absorb whatever the rail doesn't use, instead of
               being pinned to 58%. Previously stage was `0 0 58%` and the rail
               `0 0 auto` (~251px intrinsic), so on any viewport where those two
               didn't happen to sum to 100% the remainder was left as dead space at
               the bottom — measured 77px at 390x844 and 106px at 412x915. Keeping
               a min-height preserves a usable video area on short screens; the
               basis stays 58% so the initial proportions are unchanged where they
               already added up. */
            #panelCameras .camera-stage {
                flex: 1 1 58%;
                min-height: 300px;
            }
            #panelCameras .live-utility-rail {
                /* Shrink-but-don't-grow: the rail keeps its intrinsic height and
                   yields surplus to the stage, and can compress on short screens
                   rather than overflowing (measured -88px at 320x568). */
                flex: 0 1 auto;
                flex-direction: row;
                min-height: 200px;
                padding: 10px;
                padding-bottom: calc(10px + var(--safe-bottom, 0px));
                border-top: 1px solid var(--lv-pill-border-soft);
            }
            #panelCameras .camera-selector-card,
            #panelCameras .live-location-card {
                flex: 1 1 50%;
                min-width: 0;
                min-height: 200px;
            }
            #panelCameras .live-location-card {
                margin-top: 0;
                margin-left: 10px;
            }
            #panelCameras .camera-selector-card .car-selector-bottom {
                padding: 8px;
                padding-bottom: 8px;
            }

            /* Expanding the map floats .mobile-header (position:absolute, z-index:60)
               over the panel so tiles paint to the top edge — see
               body.live-map-active in styles.css. The expanded card's header, which
               carries the ONLY "Back to cameras" control, sits at top:0 and was
               therefore covered 100% by that floating header on every phone size:
               the user had no way back except the sidebar. Start the card below the
               header instead of under it. The header is display:none above 768px, so
               this offset belongs in the mobile query only. */
            #panelCameras.map-expanded .live-location-card {
